<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1446"/>
      <stop offset="0.55" stop-color="#3A1D8F"/>
      <stop offset="1" stop-color="#0E6E8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D5FF"/>
      <stop offset="0.5" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4F1FF"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05021A" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- squircle -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="208" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="232" y="262" width="560" height="380" rx="54" fill="url(#screen)" stroke="url(#rim)" stroke-width="22"/>
    <path d="M452 652 L432 742 L592 742 L572 652 Z" fill="url(#rim)" opacity="0.9"/>
    <rect x="372" y="736" width="280" height="30" rx="15" fill="url(#rim)"/>
  </g>
  <!-- cleaning swoosh -->
  <path d="M270 560 C 380 470, 560 640, 760 360" fill="none" stroke="url(#swoosh)" stroke-width="30" stroke-linecap="round" opacity="0.95"/>
  <path d="M290 600 C 410 530, 560 650, 740 470" fill="none" stroke="url(#swoosh)" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  <!-- main sparkle -->
  <g transform="translate(560 410)">
    <path d="M0 -150 C 18 -40, 40 -18, 150 0 C 40 18, 18 40, 0 150 C -18 40, -40 18, -150 0 C -40 -18, -18 -40, 0 -150 Z" fill="#A5F3FC" filter="url(#soft)" opacity="0.8"/>
    <path d="M0 -130 C 16 -36, 36 -16, 130 0 C 36 16, 16 36, 0 130 C -16 36, -36 16, -130 0 C -36 -16, -16 -36, 0 -130 Z" fill="url(#spark)"/>
  </g>
  <g transform="translate(395 345)">
    <path d="M0 -52 C 6 -14, 14 -6, 52 0 C 14 6, 6 14, 0 52 C -6 14, -14 6, -52 0 C -14 -6, -6 -14, 0 -52 Z" fill="#FFFFFF" opacity="0.92"/>
  </g>
  <g transform="translate(690 545)">
    <path d="M0 -34 C 4 -9, 9 -4, 34 0 C 9 4, 4 9, 0 34 C -4 9, -9 4, -34 0 C -9 -4, -4 -9, 0 -34 Z" fill="#F5D0FE"/>
  </g>
  <circle cx="330" cy="470" r="9" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="720" cy="300" r="7" fill="#FFFFFF" opacity="0.6"/>
</svg>
