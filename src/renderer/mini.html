<!DOCTYPE html>
<!-- LimpiaPc-MX · panel rápido · SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="es"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="css/app.css">
<style>
  body { background: transparent; overflow: hidden; }
  .panel { margin: 6px; height: calc(100vh - 12px); border-radius: 20px; background: linear-gradient(160deg, #1d1650, #120d2e 60%, #0b2a3c); border: 1px solid rgba(255,255,255,.1); padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #f3f0ff; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .t { background: rgba(255,255,255,.06); border-radius: 14px; padding: 12px; }
  .t .n { font-size: 20px; font-weight: 700; } .t .l { font-size: 11px; color: #a9a3c9; }
  .bar { height: 5px; background: rgba(255,255,255,.1); border-radius: 5px; margin-top: 8px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg,#8b5cf6,#22d3ee); }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .acts .btn { justify-content: center; font-size: 12.5px; }
  .p { display: flex; font-size: 12px; padding: 4px 2px; color: #cfc9ee; } .p span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style></head>
<body><div class="panel">
  <div class="row"><img src="../../assets/logo-512.png" style="width:30px"><b>LimpiaPc-MX</b><span class="spacer"></span><span id="score" class="pill info">—</span></div>
  <div class="g">
    <div class="t"><div class="l">Procesador</div><div class="n" id="cpu">—</div><div class="bar"><i id="cpub"></i></div></div>
    <div class="t"><div class="l">Memoria</div><div class="n" id="ram">—</div><div class="bar"><i id="ramb"></i></div></div>
    <div class="t"><div class="l">Disco libre</div><div class="n" id="disk">—</div><div class="bar"><i id="diskb"></i></div></div>
    <div class="t"><div class="l" id="l4">Red</div><div class="n" id="net" style="font-size:14px">—</div><div class="l" id="extra"></div></div>
  </div>
  <div class="t" style="flex:1;overflow:hidden"><div class="l" style="margin-bottom:6px">Mayor consumo de memoria</div><div id="procs"></div></div>
  <div class="acts">
    <button class="btn primary" id="ram-free">Liberar RAM</button>
    <button class="btn" id="trash">Vaciar papelera</button>
    <button class="btn" id="screen">Limpiar pantalla</button>
    <button class="btn" id="open">Abrir app</button>
  </div>
</div>
<script src="js/ui.js"></script>
<script src="js/mini.js"></script>
</body></html>
