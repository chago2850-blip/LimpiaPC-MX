name: Instaladores

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencias de Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Prueba automática (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox scripts/selftest.js
      - name: Construir instaladores
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: LimpiaPc-MX ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          fail_on_unmatched_files: false
          body: |
            ## LimpiaPc-MX — instaladores

            | Sistema | Archivo |
            |---|---|
            | **Windows 10/11** (instalador) | `LimpiaPc-MX-*-win-x64.exe` |
            | **Windows** (portable, sin instalar) | `LimpiaPc-MX-*-win-portable.exe` |
            | **macOS** 11+ (Intel y Apple Silicon) | `LimpiaPc-MX-*-mac-universal.dmg` |
            | **Linux** (cualquier distro) | `LimpiaPc-MX-*-linux-x86_64.AppImage` |
            | **Ubuntu / Debian / Mint** | `LimpiaPc-MX-*-linux-amd64.deb` |
            | **Fedora / openSUSE / RHEL** | `LimpiaPc-MX-*-linux-x86_64.rpm` |

            **macOS:** la app no está notarizada por Apple. La primera vez haz clic derecho → *Abrir*, o ejecuta `xattr -cr /Applications/LimpiaPc-MX.app`.
            **Windows:** si SmartScreen avisa, elige *Más información → Ejecutar de todas formas*.

            Software libre bajo GPL-3.0-or-later · © 2026 Santiago Miguel
